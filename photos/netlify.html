<!DOCTYPE html>
<html>
<body>
  <form name="booking-request" netlify netlify-honeypot="bot-field">
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="location" />
    <input type="text" name="service" />
    <input type="text" name="num_pets" />
    <input type="date" name="start_date" />
    <input type="date" name="end_date" />
    <input type="text" name="pet_details" />
    <textarea name="special_instructions"></textarea>
    <input type="text" name="referral_source" />
    <input name="bot-field" />
  </form>

  <form name="contact-inquiry" netlify netlify-honeypot="bot-field">
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <form name="review-submission" netlify netlify-honeypot="bot-field">
    <input type="text" name="reviewer_name" />
    <input type="text" name="service_used" />
    <input type="text" name="overall_rating" />
    <input type="text" name="cleanliness" />
    <input type="text" name="communication" />
    <input type="text" name="house_rules" />
    <input type="text" name="pet_care" />
    <input type="text" name="punctuality" />
    <input type="text" name="safety" />
    <input type="text" name="plant_care" />
    <input type="text" name="time_kept" />
    <input type="text" name="no_guests" />
    <input type="text" name="would_recommend" />
    <textarea name="review_text"></textarea>
    <input type="text" name="pet_names" />
    <input name="bot-field" />
  </form>
</body>
</html>
